<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My Car</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 360px; margin: 3rem auto; }
  h1 { font-size: 1.2rem; }
  .bar { height: 24px; background: #eee; border-radius: 12px; overflow: hidden; margin: 0.5rem 0; }
  .fill { height: 100%; background: #2e7d32; transition: width 0.3s; }
  .row { display: flex; justify-content: space-between; align-items: center; margin: 1rem 0; }
  button { padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; }
  input[type=time] { font-size: 1rem; padding: 0.3rem; }
  .badge { padding: 0.2rem 0.6rem; border-radius: 8px; font-size: 0.85rem; }
  .charging { background: #c8e6c9; color: #1b5e20; }
  .idle { background: #eee; color: #555; }
  .offline { background: #e0e0e0; color: #757575; }
  .alert { background: #fdecea; color: #611a15; border: 1px solid #f5c6cb; border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 1rem; font-size: 0.9rem; }
</style>
</head>
<body>
  <h1>My Car Battery</h1>

  <div id="alertBanner" class="alert" hidden></div>

  <div class="bar"><div class="fill" id="fill" style="width:0%"></div></div>
  <div class="row">
    <span id="level">--%</span>
    <span id="status" class="badge idle">Idle</span>
  </div>

  <div class="row">
    <button id="startBtn">Start Charging</button>
    <button id="stopBtn">Stop Charging</button>
  </div>

  <div class="row">
    <input type="time" id="scheduleInput">
    <button id="scheduleBtn">Set Schedule</button>
  </div>

  <p><small id="updated"></small></p>

<script>
  const API = "https://car-battery-func-cffueff0bjaphuaq.newzealandnorth-01.azurewebsites.net/api";

  async function refresh() {
    const res = await fetch(`${API}/battery`);
    const data = await res.json();

    const level = data.batteryLevel ?? 0;
    document.getElementById("fill").style.width = `${level}%`;
    document.getElementById("level").textContent = `${level}%`;

    const isOffline = data.alert === "unexpected_disconnect_while_charging";
    const statusEl = document.getElementById("status");
    if (isOffline) {
      statusEl.textContent = "Offline";
      statusEl.className = "badge offline";
    } else {
      statusEl.textContent = data.isCharging ? "Charging" : "Idle";
      statusEl.className = "badge " + (data.isCharging ? "charging" : "idle");
    }

    document.getElementById("scheduleInput").value = data.schedule ?? "";
    document.getElementById("updated").textContent = data.lastUpdated
      ? `Last updated: ${new Date(data.lastUpdated).toLocaleTimeString()}`
      : "No data yet";

    const banner = document.getElementById("alertBanner");
    if (data.alert === "unexpected_disconnect_while_charging") {
      const at = data.alertAt ? new Date(data.alertAt).toLocaleTimeString() : "";
      banner.textContent = `⚠️ Car disconnected unexpectedly while charging${at ? ` at ${at}` : ""}.`;
      banner.hidden = false;
    } else {
      banner.hidden = true;
    }
  }

  document.getElementById("startBtn").onclick = async () => {
    await fetch(`${API}/charging`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ charging: true })
    });
    refresh();
  };

  document.getElementById("stopBtn").onclick = async () => {
    await fetch(`${API}/charging`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ charging: false })
    });
    refresh();
  };

  document.getElementById("scheduleBtn").onclick = async () => {
    const time = document.getElementById("scheduleInput").value;
    if (!time) return;
    await fetch(`${API}/schedule`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ time })
    });
    refresh();
  };

  refresh();
  setInterval(refresh, 5000);
</script>
</body>
</html>
