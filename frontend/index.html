<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Car</title>
<style>
  :root {
    --green: #2e7d32;
    --green-light: #c8e6c9;
    --green-dark: #1b5e20;
    --amber-bg: #fff4e5;
    --amber-border: #ffd699;
    --amber-text: #7a4a00;
    --red-bg: #fdecea;
    --red-border: #f5c6cb;
    --red-text: #611a15;
    --gray-bg: #eef0f2;
    --gray-text: #667085;
    --ink: #1c2430;
    --card: #ffffff;
    --page: #f4f6f9;
    --border: #e4e7eb;
  }

  * { box-sizing: border-box; }

  body {
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    background: var(--page);
    color: var(--ink);
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 3rem 1rem;
  }

  .card {
    width: 100%;
    max-width: 380px;
    background: var(--card);
    border-radius: 20px;
    box-shadow: 0 1px 3px rgba(20, 30, 50, 0.06), 0 8px 24px rgba(20, 30, 50, 0.08);
    padding: 1.75rem;
  }

  h1 {
    font-size: 1.15rem;
    font-weight: 600;
    margin: 0 0 1.25rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  h1 .emoji { font-size: 1.3rem; }

  .car-select {
    width: 100%;
    font-size: 0.9rem;
    font-weight: 600;
    padding: 0.5rem 0.6rem;
    margin-bottom: 1rem;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--page);
    color: var(--ink);
  }

  .alert[hidden] { display: none; }

  .alert {
    display: flex;
    gap: 0.5rem;
    align-items: flex-start;
    background: var(--red-bg);
    color: var(--red-text);
    border: 1px solid var(--red-border);
    border-radius: 12px;
    padding: 0.7rem 0.85rem;
    margin-bottom: 1.1rem;
    font-size: 0.85rem;
    line-height: 1.4;
    animation: slide-in 0.25s ease-out;
  }

  @keyframes slide-in {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .level-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 0.5rem;
  }

  .level-number {
    font-size: 2.1rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .level-number small { font-size: 1.1rem; font-weight: 600; color: var(--gray-text); }

  .bar {
    height: 16px;
    background: var(--gray-bg);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 1.25rem;
    position: relative;
  }

  .fill {
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, #43a047, var(--green));
    transition: width 0.5s ease;
    position: relative;
    overflow: hidden;
  }

  .fill.low { background: linear-gradient(90deg, #e57373, #d32f2f); }
  .fill.mid { background: linear-gradient(90deg, #ffb74d, #f57c00); }

  .fill.charging::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.45), transparent);
    animation: shine 1.6s linear infinite;
  }

  @keyframes shine {
    from { transform: translateX(-100%); }
    to { transform: translateX(100%); }
  }

  .badge {
    padding: 0.25rem 0.7rem;
    border-radius: 999px;
    font-size: 0.78rem;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
  }

  .badge::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
  }

  .charging { background: var(--green-light); color: var(--green-dark); }
  .idle { background: var(--gray-bg); color: var(--gray-text); }
  .offline { background: #ececec; color: #8a8a8a; }

  .divider { border: none; border-top: 1px solid var(--border); margin: 1.25rem 0; }

  .row { display: flex; gap: 0.6rem; margin-bottom: 0.75rem; }

  button {
    flex: 1;
    padding: 0.65rem 0.8rem;
    font-size: 0.9rem;
    font-weight: 600;
    border-radius: 10px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: transform 0.05s ease, filter 0.15s ease;
  }

  button:active { transform: scale(0.98); }

  #toggleBtn.action-start { background: var(--green); color: white; }
  #toggleBtn.action-start:hover { filter: brightness(1.08); }

  #toggleBtn.action-stop { background: var(--card); color: var(--ink); border-color: var(--border); }
  #toggleBtn.action-stop:hover { background: var(--gray-bg); }

  #toggleBtn:disabled {
    background: var(--gray-bg);
    color: var(--gray-text);
    cursor: not-allowed;
  }
  #toggleBtn:disabled:active { transform: none; }

  .action-error {
    color: var(--red-text);
    font-size: 0.8rem;
    text-align: center;
    margin: 0.5rem 0 0;
  }

  .schedule-row { display: flex; gap: 0.6rem; align-items: center; }

  .current-schedule {
    flex: 1;
    margin: 0;
    font-size: 0.8rem;
    color: var(--gray-text);
  }

  .schedule-row button {
    flex: none;
    padding: 0.5rem 0.75rem;
    font-size: 0.8rem;
  }

  #openScheduleBtn { background: var(--ink); color: white; }
  #openScheduleBtn:hover { filter: brightness(1.15); }

  #clearScheduleBtn { background: var(--card); color: var(--red-text); border-color: var(--border); }
  #clearScheduleBtn:hover { background: var(--red-bg); }

  .updated {
    margin-top: 1.1rem;
    font-size: 0.75rem;
    color: var(--gray-text);
    text-align: center;
  }

  dialog#scheduleDialog {
    width: 100%;
    max-width: 340px;
    border: none;
    border-radius: 16px;
    padding: 1.5rem;
    color: var(--ink);
    box-shadow: 0 8px 24px rgba(20, 30, 50, 0.16);
  }
  dialog#scheduleDialog::backdrop { background: rgba(20, 30, 50, 0.35); }

  dialog#scheduleDialog h2 {
    font-size: 1.05rem;
    margin: 0 0 1.1rem;
  }

  .schedule-field {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    margin-bottom: 1rem;
  }

  .schedule-field > label {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-size: 0.9rem;
    font-weight: 600;
  }

  .schedule-field input[type=time] {
    font-size: 0.9rem;
    padding: 0.4rem 0.5rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    color: var(--ink);
    background: var(--page);
  }
  .schedule-field input[type=time]:disabled { color: var(--gray-text); background: var(--gray-bg); }

  /* Minimal switch look on top of a plain checkbox - no library needed. */
  input.switch {
    appearance: none;
    width: 34px;
    height: 20px;
    border-radius: 999px;
    background: var(--gray-bg);
    border: 1px solid var(--border);
    position: relative;
    cursor: pointer;
    flex: none;
  }
  input.switch::after {
    content: "";
    position: absolute;
    top: 1px;
    left: 1px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: white;
    box-shadow: 0 1px 2px rgba(20, 30, 50, 0.3);
    transition: transform 0.15s ease;
  }
  input.switch:checked { background: var(--green); border-color: var(--green); }
  input.switch:checked::after { transform: translateX(14px); }

  .day-picker {
    display: flex;
    justify-content: space-between;
    margin: -0.4rem 0 1.1rem;
  }

  .day-picker button {
    width: 32px;
    height: 32px;
    padding: 0;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--page);
    color: var(--ink);
    font-size: 0.75rem;
    font-weight: 700;
    flex: none;
  }
  .day-picker button.selected { background: var(--green); border-color: var(--green); color: white; }

  .dialog-actions { display: flex; gap: 0.6rem; margin-top: 0.5rem; }
  .dialog-actions button[type=submit] { background: var(--green); color: white; }
  .dialog-actions button[type=submit]:hover { filter: brightness(1.08); }
  .dialog-actions button[type=button] { background: var(--card); color: var(--ink); border-color: var(--border); }
  .dialog-actions button[type=button]:hover { background: var(--gray-bg); }
</style>
</head>
<body>
  <div class="card">
    <h1><span class="emoji">🔋</span>My Car Battery</h1>

    <select id="carSelect" class="car-select"></select>

    <div id="alertBanner" class="alert" hidden></div>

    <div class="level-row">
      <span class="level-number" id="level">--<small>%</small></span>
      <span id="status" class="badge idle">Idle</span>
    </div>
    <div class="bar"><div class="fill" id="fill" style="width:0%"></div></div>

    <hr class="divider">

    <div class="row">
      <button id="toggleBtn" class="action-start">▶ Start Charging</button>
    </div>
    <p id="actionError" class="action-error" hidden></p>

    <div class="schedule-row">
      <p class="current-schedule" id="currentSchedule">No schedule set</p>
      <button id="openScheduleBtn">Set Schedule</button>
      <button id="clearScheduleBtn" hidden>Clear</button>
    </div>

    <p class="updated" id="updated"></p>
  </div>

  <dialog id="scheduleDialog">
    <form method="dialog" id="scheduleForm">
      <h2>Create Charging Schedule</h2>

      <div class="schedule-field">
        <label>
          <input type="checkbox" id="startEnabled" class="switch">
          Start Charging at
        </label>
        <input type="time" id="startTime" disabled>
      </div>

      <div class="schedule-field">
        <label>
          <input type="checkbox" id="endEnabled" class="switch">
          End Charging by
        </label>
        <input type="time" id="endTime" disabled>
      </div>

      <div class="schedule-field">
        <label>
          <input type="checkbox" id="repeatWeekly" class="switch">
          Repeat Weekly
        </label>
      </div>

      <div id="dayPicker" class="day-picker" hidden>
        <button type="button" data-day="0">S</button>
        <button type="button" data-day="1">M</button>
        <button type="button" data-day="2">T</button>
        <button type="button" data-day="3">W</button>
        <button type="button" data-day="4">T</button>
        <button type="button" data-day="5">F</button>
        <button type="button" data-day="6">S</button>
      </div>

      <p id="scheduleFormError" class="action-error" hidden></p>

      <div class="dialog-actions">
        <button type="submit" id="createScheduleBtn">Create</button>
        <button type="button" id="cancelScheduleBtn">Cancel</button>
      </div>
    </form>
  </dialog>

<script>
  const API = "https://car-battery-func-cffueff0bjaphuaq.newzealandnorth-01.azurewebsites.net/api";
  // const API = "http://localhost:7071/api";

  // ponytail: 6s covers one device tick (~1s) + one frontend poll (~2s)
  // with margin - not a measured SLA, just generous enough not to false-fire.
  const PENDING_TIMEOUT_MS = 6000;

  const DAY_NAMES = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

  const toggleBtn = document.getElementById("toggleBtn");
  const actionError = document.getElementById("actionError");
  const carSelect = document.getElementById("carSelect");
  const currentScheduleEl = document.getElementById("currentSchedule");
  const clearScheduleBtn = document.getElementById("clearScheduleBtn");
  const scheduleDialog = document.getElementById("scheduleDialog");
  const startEnabled = document.getElementById("startEnabled");
  const startTime = document.getElementById("startTime");
  const endEnabled = document.getElementById("endEnabled");
  const endTime = document.getElementById("endTime");
  const repeatWeekly = document.getElementById("repeatWeekly");
  const dayPicker = document.getElementById("dayPicker");
  const scheduleFormError = document.getElementById("scheduleFormError");
  let selectedDeviceId = null;
  let lastKnownCharging = false;
  let pendingAction = null; // null | "start" | "stop"
  let pendingTimer = null;
  let wasAlertVisible = false;
  let lastSchedule = null; // { start, end, days, date } | null - the dialog only reads this when it opens, never from a live poll while it's open
  let selectedDays = new Set(); // of single-char strings "0".."6"
  let lastSeenRejectedCommandAt = null; // dedupes repeated polls of the same rejection so the warning doesn't re-flash every second

  async function loadCars() {
    const res = await fetch(`${API}/cars`);
    const deviceIds = await res.json();
    carSelect.innerHTML = deviceIds.map(id => `<option value="${id}">${id}</option>`).join("");
    selectedDeviceId = deviceIds[0] ?? null;
  }

  carSelect.onchange = () => {
    selectedDeviceId = carSelect.value;
    // Switching cars: don't carry over the previous car's pending/alert UI state.
    clearPending();
    actionError.hidden = true;
    wasAlertVisible = false;
    lastSeenRejectedCommandAt = null; // new car - a rejection notice from the previous one doesn't apply here
    if (scheduleDialog.open) scheduleDialog.close(); // don't leave one car's draft open against another car
    refresh();
  };

  function renderToggleButton(isCharging) {
    if (pendingAction) return; // don't fight the pending state, refresh() owns it while waiting
    toggleBtn.disabled = false;
    if (isCharging) {
      toggleBtn.textContent = "⏸ Stop Charging";
      toggleBtn.className = "action-stop";
    } else {
      toggleBtn.textContent = "▶ Start Charging";
      toggleBtn.className = "action-start";
    }
  }

  function clearPending() {
    pendingAction = null;
    if (pendingTimer) {
      clearTimeout(pendingTimer);
      pendingTimer = null;
    }
  }

  async function refresh() {
    if (!selectedDeviceId) return;
    const res = await fetch(`${API}/battery?deviceId=${selectedDeviceId}`);
    const data = await res.json();

    const level = data.batteryLevel ?? 0;
    const fillEl = document.getElementById("fill");
    fillEl.style.width = `${level}%`;
    fillEl.classList.toggle("low", level < 20);
    fillEl.classList.toggle("mid", level >= 20 && level < 50);
    fillEl.classList.toggle("charging", !!data.isCharging);
    document.getElementById("level").innerHTML = `${level}<small>%</small>`;

    lastKnownCharging = !!data.isCharging;

    // Did the pending start/stop we're waiting on actually happen?
    if (pendingAction === "start" && lastKnownCharging) {
      clearPending();
      actionError.hidden = true;
    } else if (pendingAction === "stop" && !lastKnownCharging) {
      clearPending();
      actionError.hidden = true;
    }

    renderToggleButton(lastKnownCharging);

    // The device rejected a Start/Stop command as stale (issued too long
    // before it reconnected) - see BatterySimulation.IsCommandFresh on the
    // device side. Only show this once per distinct rejection timestamp, so
    // it doesn't re-flash on every 1s poll while it's the current value.
    if (data.lastCommandRejectedAt && data.lastCommandRejectedAt !== lastSeenRejectedCommandAt) {
      lastSeenRejectedCommandAt = data.lastCommandRejectedAt;
      actionError.textContent = "⚠️ A charging command expired before the car reconnected - please try again.";
      actionError.hidden = false;
    }

    const isOffline = data.alert === "unexpected_disconnect_while_charging";
    const statusEl = document.getElementById("status");
    if (isOffline) {
      statusEl.textContent = "Offline";
      statusEl.className = "badge offline";
    } else {
      statusEl.textContent = data.isCharging ? "Charging" : "Idle";
      statusEl.className = "badge " + (data.isCharging ? "charging" : "idle");
    }

    // Display-only, updated every poll. The dialog's own fields are never
    // touched here - it only reads lastSchedule once, at the moment it
    // opens - so a poll landing while the owner has the dialog open can't
    // fight their in-progress edit (the earlier single-input version had
    // exactly that bug; see git history for the focus-guard patch that
    // wasn't quite enough, which is why the dialog exists at all now).
    lastSchedule = data.schedule;
    currentScheduleEl.textContent = formatSchedule(data.schedule);
    clearScheduleBtn.hidden = !data.schedule;
    document.getElementById("updated").textContent = data.lastUpdated
      ? `Last updated ${new Date(data.lastUpdated).toLocaleTimeString()}`
      : "No data yet";

    const banner = document.getElementById("alertBanner");
    const alertNowVisible = data.alert === "unexpected_disconnect_while_charging";
    if (alertNowVisible) {
      const at = data.alertAt ? new Date(data.alertAt).toLocaleTimeString() : "";
      banner.innerHTML = `<span>⚠️</span><span>Car disconnected unexpectedly while charging${at ? ` at ${at}` : ""}.</span>`;
      banner.hidden = false;
    } else {
      banner.hidden = true;
      if (wasAlertVisible) {
        // Recovering from an unexpected disconnect: don't silently resume
        // showing "Charging" just because isCharging happens to read true
        // again - force the UI back to a known-safe idle state and make
        // the owner press Start again, same as a real charger post-fault.
        clearPending();
        lastKnownCharging = false;
        renderToggleButton(false);
      }
    }
    wasAlertVisible = alertNowVisible;
  }

  toggleBtn.onclick = async () => {
    if (!selectedDeviceId) return; // cars list hasn't loaded yet
    const startingUp = !lastKnownCharging; // button reflects current state, so this click means "do the opposite"
    pendingAction = startingUp ? "start" : "stop";
    actionError.hidden = true;
    toggleBtn.disabled = true;
    toggleBtn.textContent = startingUp ? "Starting…" : "Stopping…";

    await fetch(`${API}/charging?deviceId=${selectedDeviceId}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ charging: startingUp })
    });

    pendingTimer = setTimeout(() => {
      if (pendingAction !== (startingUp ? "start" : "stop")) return; // already confirmed by a refresh()
      clearPending();
      actionError.textContent = startingUp
        ? "⚠️ Car didn't start charging - check it's connected."
        : "⚠️ Car didn't stop charging - check it's connected.";
      actionError.hidden = false;
      renderToggleButton(lastKnownCharging);
    }, PENDING_TIMEOUT_MS);

    refresh();
  };

  function formatSchedule(schedule) {
    if (!schedule || (!schedule.start && !schedule.end)) return "No schedule set";

    const parts = [];
    if (schedule.start) parts.push(`Start ${schedule.start}`);
    if (schedule.end) parts.push(`End ${schedule.end}`);

    let when;
    if (schedule.date) {
      when = `once on ${schedule.date}`;
    } else if (schedule.days) {
      when = [...schedule.days].map(d => DAY_NAMES[Number(d)]).join(", ");
    } else {
      when = "daily";
    }

    return `${parts.join(", ")} (${when})`;
  }

  // Computes the next calendar date this time will occur - today if it
  // hasn't passed yet, otherwise tomorrow. Used for a one-time (non-repeat)
  // schedule, where the device needs an actual date rather than a weekday set.
  function nextOccurrence(timeStr) {
    const [h, m] = timeStr.split(":").map(Number);
    const now = new Date();
    const candidate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m);
    if (candidate <= now) candidate.setDate(candidate.getDate() + 1);

    const yyyy = candidate.getFullYear();
    const mm = String(candidate.getMonth() + 1).padStart(2, "0");
    const dd = String(candidate.getDate()).padStart(2, "0");
    return `${yyyy}-${mm}-${dd}`;
  }

  startEnabled.onchange = () => { startTime.disabled = !startEnabled.checked; };
  endEnabled.onchange = () => { endTime.disabled = !endEnabled.checked; };
  repeatWeekly.onchange = () => { dayPicker.hidden = !repeatWeekly.checked; };

  dayPicker.querySelectorAll("button").forEach(btn => {
    btn.onclick = () => {
      const day = btn.dataset.day;
      if (selectedDays.has(day)) selectedDays.delete(day); else selectedDays.add(day);
      btn.classList.toggle("selected", selectedDays.has(day));
    };
  });

  document.getElementById("openScheduleBtn").onclick = () => {
    // Pre-fill from the last poll's result, once, right now - never from a
    // poll that lands later while the dialog is still open.
    const s = lastSchedule;

    startEnabled.checked = !!s?.start;
    startTime.value = s?.start ?? "";
    startTime.disabled = !startEnabled.checked;

    endEnabled.checked = !!s?.end;
    endTime.value = s?.end ?? "";
    endTime.disabled = !endEnabled.checked;

    repeatWeekly.checked = !!s?.days;
    dayPicker.hidden = !repeatWeekly.checked;
    selectedDays = new Set(s?.days ? [...s.days] : []);
    dayPicker.querySelectorAll("button").forEach(btn => {
      btn.classList.toggle("selected", selectedDays.has(btn.dataset.day));
    });

    scheduleFormError.hidden = true;
    scheduleDialog.showModal();
  };

  document.getElementById("cancelScheduleBtn").onclick = () => scheduleDialog.close();

  document.getElementById("scheduleForm").onsubmit = async (e) => {
    e.preventDefault();
    if (!selectedDeviceId) return;

    const start = startEnabled.checked ? startTime.value : null;
    const end = endEnabled.checked ? endTime.value : null;
    if ((startEnabled.checked && !start) || (endEnabled.checked && !end)) {
      scheduleFormError.textContent = "Pick a time for each toggle that's on.";
      scheduleFormError.hidden = false;
      return;
    }
    if (!start && !end) {
      scheduleFormError.textContent = "Turn on at least one of Start or End.";
      scheduleFormError.hidden = false;
      return;
    }

    let days = null;
    let date = null;
    if (repeatWeekly.checked) {
      if (selectedDays.size === 0) {
        scheduleFormError.textContent = "Pick at least one day, or turn off Repeat Weekly.";
        scheduleFormError.hidden = false;
        return;
      }
      days = [...selectedDays].sort().join("");
    } else {
      date = nextOccurrence(start ?? end);
    }

    await fetch(`${API}/schedule?deviceId=${selectedDeviceId}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ start, end, days, date })
    });

    scheduleDialog.close();
    refresh();
  };

  clearScheduleBtn.onclick = async () => {
    if (!selectedDeviceId) return;
    await fetch(`${API}/schedule?deviceId=${selectedDeviceId}`, { method: "DELETE" });
    refresh();
  };

  loadCars().then(refresh);
  setInterval(refresh, 1000);

  // Browsers throttle setInterval in background tabs - refresh immediately
  // when the tab becomes visible again instead of waiting for the next
  // (possibly delayed) tick.
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) refresh();
  });
</script>
</body>
</html>
